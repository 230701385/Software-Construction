services:
  mongo:
    image: mongo
    container_name: hospital-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      -  MONGO_INITDB_ROOT_PASSWORD=qwerty
    ports:
      - "27017:27017"
    volumes:
      - hospital-db:/data/db

  mongo-express:
    image: mongo-express
    container_name: hospital-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwerty
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on:
      - mongo

  backend:
    image: vishwak16/hospital-backend:v1
    container_name: hospital-backend
    ports:
    - "5085:5085"
    depends_on:
    - mongo

volumes:
  hospital-db: